# analog-optimizer 项目契约示例，不是已有训练程序的运行配置。
# 所有枚举和键名都是建议的项目 schema；Codex 需要按现有仓库实现/适配。
# null 表示必须从本地环境/PDK/实验决定获得的值，不能自动补造。
artifact_type: project_contract_example
schema_version: "0.1"
reference_date: "2026-09-19"

scope:
  task: fixed_topology_analog_sizing
  initial_milestone: M1
  later_families: [ldo, vco, opamp]
  topology_search: false

backend:
  kind: mock
  real_backend_preference: virtuoso_bridge
  bridge_checkout: null
  bridge_version_or_commit: null
  bridge_profile_or_env_file: null
  execution_mode: null        # local / remote；从实际部署决定
  local_workspace: null
  remote_workspace: null
  timeout_seconds: null
  allow_real_simulation: false
  allow_schematic_write: false
  result_origin_required: true
  failure_policy:
    classify_design_and_infrastructure: true
    silent_mock_fallback: false

circuit:
  source_netlist: null
  dialect: spectre
  dut_boundary: null
  pdk_mapping_file: null
  include_allowlist: []
  analysis_manifest: null
  corner: null
  temperature_kelvin: null

graph:
  canonical_schema: device_net_terminal_multigraph
  explicit_reverse_relations: true
  preserve_parallel_terminal_connections: true
  learn_from_raw_instance_names: false
  pyg_storage: null          # HeteroData 或具有等价 type/port 契约的 Data
  parameter_groups_separate: true
  unresolved_values_have_masks: true

model:
  encoder_type: graph_transformer # 当前接口：graph_transformer / mlp / gcn / rgcn / gat / port_gnn
  attention_mode: null       # 旧入口的兼容别名；当前 GT 是 local_port_attention
  hidden_dim: null
  layers: null
  attention_heads: null
  actor_head: shared_parameter_group_head
  critics: action_conditioned_twin_graph_critics
  share_actor_critic_trainable_encoder: false # 工程起点，不是不可改的理论要求
  specification_conditioning: true

optimizer:
  algorithm: sac
  action_semantics: null     # 首先只实现一种语义，并同时定义 replay/Q 约定
  active_action_mask: true
  proposal_and_applied_parameters_logged: true
  discrete_parameter_policy: null # fixed 或 explicit_continuous_projection
  automatic_temperature: true    # 建议实现选择，需验证
  entropy_counts_only_active_independent_groups: true
  surrogate_enabled: false
  llm_in_optimization_loop: false
  mamba_enabled: false
  parallel_workers: 1

parameters: []               # 由 PDK/用户配置填充独立参数组、绑定、单位与合法域
specifications: []           # 填充 metric_id、方向、目标、scale、unit、required

training:
  evaluation_purpose: nominal
  pvt_in_training: false
  monte_carlo_in_training: false
  random_seed: null
  real_simulation_budget: null
  episode_budget: null
  update_to_data_ratio: null
  checkpoint_full_learning_state: true

validation:
  # 工况后验证仍只有接口/纯函数；不因 nominal 训练已实现而启动 PVT/MC 调度。
  selection: nominal_top_k_distinct_executed_parameters
  top_k: 3
  corner_manifest: null       # 从实际 PDK 选择 5 个代表性工况；不复制另一电路电压
  nominal_reward_unchanged: true
  lambda_failed: 1.0          # 项目工程默认，可显式调整
  reject_any_failed_corner: true
  unknown_corner_policy: incomplete_no_score
  replay_eligible: false
  monte_carlo: null           # future: samples/seed/variation/model_section + per-sample results
  synthetic_unit_tests_default: true
  real_integration_tests_opt_in: true
  required_tests:
    - terminal_roles_preserved
    - source_bulk_same_net_not_collapsed
    - hierarchy_net_scope
    - parameter_group_binding_and_projection
    - heterogeneous_size_batch_roundtrip
    - failure_classification
  split_manifest: null
  fit_normalizers_on_training_only: true
  distinguish_zero_shot_and_adaptation: true
  count_failed_and_retried_simulations: true
  report_pretraining_and_online_costs: true
  encoder_comparison:
    encoders: [graph_transformer, mlp, gcn, rgcn, gat]
    per_encoder_modes: [scratch, frozen, adapt]
    separate_pretraining_per_encoder: true
    fresh_adaptation_optimizer_and_replay: true
    capacity_control: common_width_and_depth # 不等于参数量匹配
    report_parameter_counts: true
