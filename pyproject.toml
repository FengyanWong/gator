[build-system]
requires = ["setuptools>=77"]   # the SPDX license field (PEP 639)
build-backend = "setuptools.build_meta"

[project]
# The project is called GATOR. The distribution keeps its first name, analog-optimizer, and the two packages keep
# theirs (analog_optimizer, gator_workbench). The version stays 0.1.0: the same number is written in
# src/analog_optimizer/__init__.py, which the saved models' source digest covers, and in
# src/gator_workbench/__init__.py, which every run's manifest records.
name = "analog-optimizer"
version = "0.1.0"
description = "GATOR: analog circuit sizing with graph encoders and reinforcement learning (Soft Actor-Critic)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fengyan Wang" }]
dependencies = []

[project.urls]
Repository = "https://github.com/FengyanWong/gator"
Documentation = "https://github.com/FengyanWong/gator/blob/main/docs/README.md"
Issues = "https://github.com/FengyanWong/gator/issues"

[project.optional-dependencies]
# Ranges for a fresh project. The EXACT versions that existing saved models need are in constraints.txt (pip install -c).
graph = ["torch>=2.2,<3", "torch-geometric>=2.5,<3", "numpy>=1.24,<3", "networkx>=3,<4"]
# pytest-xdist: the whole suite in about 50 s with `-n 12 --dist loadgroup` (OMP_NUM_THREADS=1), 65-95 s with -n 6 on a
# busy machine, about 5 min serially (measured 2026-09-30, 24 cores). loadgroup: see the xdist_group marker below.
# pytest below 9.2: 9.2.0 no longer has the attribute through which pytest-xdist 3.8.0 (the newest) adds a test's
# xdist_group to its name, so `--dist loadgroup` spreads a group over the workers without a word and
# tests/workbench/test_wb_maestro_helpers.py fails (record 7.475). Lift the limit when a pytest-xdist release fits.
test = ["pytest>=8,<9.2", "pytest-xdist>=3.8,<4"]
export = ["pyarrow>=14,<24"]
# Local engineering workbench (src/gator_workbench): FastAPI backend + Parquet raw tables.
# No plotting libraries by design; the workbench produces data only.
web = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2.6,<3", "pyarrow>=14,<24"]
webtest = ["httpx>=0.27,<1"]
benchmark = ["PyYAML>=6,<7", "tabulate>=0.9,<1"]

[project.scripts]
analog-graph-demo = "analog_optimizer.demo:main"
gator-workbench = "gator_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gator_workbench.local_agent" = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "requires_evidence(*paths): reads recorded local evidence (artifacts/, not in git); skipped where a path is absent",
    "xdist_group(name): pytest-xdist keeps the group on one worker under --dist loadgroup (a costly module fixture is built once)",
]
