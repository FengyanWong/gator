[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analog-optimizer"
version = "0.1.0"
description = "Terminal-aware circuit graphs and nominal graph SAC sizing"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Ranges for a fresh project. The EXACT versions that existing saved models need are in constraints.txt (pip install -c).
graph = ["torch>=2.2,<3", "torch-geometric>=2.5,<3", "numpy>=1.24,<3", "networkx>=3,<4"]
# pytest-xdist: the whole suite in about a minute with `-n 12 --dist load` (OMP_NUM_THREADS=1), instead of about five.
test = ["pytest>=8,<10", "pytest-xdist>=3.8,<4"]
export = ["pyarrow>=14,<24"]
# Local engineering workbench (src/gator_workbench): FastAPI backend + Parquet raw tables.
# No plotting libraries by design; the workbench produces data only.
web = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2.6,<3", "pyarrow>=14,<24"]
webtest = ["httpx>=0.27,<1"]

[project.scripts]
analog-graph-demo = "analog_optimizer.demo:main"
gator-workbench = "gator_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
